# Graph-based Herdr workflow. Nodes are seats; graphs are presets.
# A project may override nodes, harnesses, and graphs via layout.manifest.

layout:
  work_root: ".herdr"
  manifest: "{work_root}/workflow.yaml"
  profile: "{work_root}/project.md"
  detection: "{work_root}/detection.yaml"
  change_dir: "{work_root}/runs/{change}"
  identity: "{change_dir}/identity.yaml"
  session: "{change_dir}/run.json"
  orchestration: "{change_dir}/orchestration.yaml"
  artifacts: "{change_dir}/artifacts.yaml"
  state: "{change_dir}/tasks.yaml"
  receipts: "{change_dir}/receipts"
  worker_receipt: "{receipts}/{task}.worker.md"
  dispatcher_receipt: "{receipts}/{task}.dispatcher.md"

visibility:
  pane_label: "{title} | {cli} {model} {effort}"
  pane_label_many: "{title} {n} | {cli} {model} {effort}"
  display_agent: "{title}"
  display_agent_many: "{title} {n}"
  metadata_source: workflow-herdr
  workspace_label: "{repo} / {change}"
  workspace_label_stream: "{repo} / {change}/{stream}"
  tab_label: "{change}"
  tab_label_stream: "{change}/{stream}"

harnesses:
  human:
    kind: null
    args: []
    efforts: []
  codex:
    kind: codex
    args:
      - "--model"
      - "{model}"
      - "-c"
      - "model_reasoning_effort={effort}"
      - "--no-alt-screen"
    efforts:
      - minimal
      - low
      - medium
      - high
      - xhigh
      - max
    known_models:
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.4
      - o3
  grok:
    kind: grok
    args:
      - "--model"
      - "{model}"
      - "--reasoning-effort"
      - "{effort}"
      - "--no-alt-screen"
    efforts:
      - low
      - high
      - max
  devin:
    kind: devin
    args:
      - "--model"
      - "{model}"
    efforts:
      - low
      - medium
      - high
      - max

nodes:
  brain:
    title: Brain
    harness: human
    model: null
    effort: null
    start: false
    name: null
    owns:
      - goal
      - authority
    notes: This chat. Intent is what the human typed here.

  orchestrator:
    title: Orchestrator
    name: "{change}-orch"
    harness: codex
    model: gpt-5.6-luna
    effort: max
    start: true
    instances: 1
    brief: assets/briefs/orchestrator.md
    owns:
      - plan
      - task_list

  dispatcher:
    title: Dispatcher
    name: "{change}-disp-{n}"
    harness: codex
    model: gpt-5.6-luna
    effort: high
    start: true
    many: true
    instances: per_workstream
    brief: assets/briefs/dispatcher.md
    owns:
      - task_execution

  worker:
    title: Worker
    name: "{change}-w-{n}"
    harness: devin
    model: swe2
    effort: max
    start: true
    many: true
    instances: per_task
    brief: assets/briefs/worker.md
    owns:
      - receipt

graphs:
  small:
    use_when: One short prompt, one turn, no open design decisions
    topology: split_in_current_tab
    project_artifacts: none
    coordination_state: false
    worktrees: false
    parallel: false
    layout:
      when: before_handoff
      seats:
        - worker
      tab: keep
      workspace: keep
    nodes:
      - brain
      - worker
    entry: brain
    transitions:
      - from: brain
        to: worker
        on: goal_ready
      - from: worker
        to: brain
        on: done

  medium:
    use_when: One story, several files, decisions still fit one context
    topology: split_in_current_tab
    project_artifacts: per-project-profile
    coordination_state: true
    worktrees: false
    parallel: false
    layout:
      when: before_handoff
      seats:
        - orchestrator
        - dispatcher
        - worker
      tab: rename
      workspace: keep
    nodes:
      - brain
      - orchestrator
      - dispatcher
      - worker
    entry: brain
    transitions:
      - from: brain
        to: orchestrator
        on: goal_created
      - from: orchestrator
        to: dispatcher
        on: task_ready
      - from: dispatcher
        to: worker
        on: assigned
      - from: worker
        to: dispatcher
        on: progress
        loop: true
      - from: worker
        to: dispatcher
        on: completed
      - from: worker
        to: dispatcher
        on: blocked
      - from: dispatcher
        to: worker
        on: correction
        loop: true
      - from: dispatcher
        to: orchestrator
        on: accepted
      - from: dispatcher
        to: orchestrator
        on: rejected
      - from: dispatcher
        to: orchestrator
        on: blocked
      - from: orchestrator
        to: dispatcher
        on: next_task
      - from: orchestrator
        to: dispatcher
        on: plan_revised
      - from: orchestrator
        to: dispatcher
        on: new_plan
      - from: orchestrator
        to: brain
        on: need_human
      - from: orchestrator
        to: brain
        on: plan_closed

  large:
    use_when: Two or more runnable workstreams with non-overlapping file boundaries
    topology: worktree_workspace_per_stream
    project_artifacts: per-project-profile
    coordination_state: true
    worktrees: true
    parallel: true
    layout:
      when: before_handoff
      seats:
        - orchestrator
        - dispatcher
        - worker
      tab: rename
      workspace: worktree
    nodes:
      - brain
      - orchestrator
      - dispatcher
      - worker
    entry: brain
    transitions:
      - from: brain
        to: orchestrator
        on: goal_created
      - from: orchestrator
        to: dispatcher
        on: task_ready
      - from: dispatcher
        to: worker
        on: assigned
      - from: worker
        to: dispatcher
        on: progress
        loop: true
      - from: worker
        to: dispatcher
        on: completed
      - from: worker
        to: dispatcher
        on: blocked
      - from: dispatcher
        to: worker
        on: correction
        loop: true
      - from: dispatcher
        to: orchestrator
        on: accepted
      - from: dispatcher
        to: orchestrator
        on: rejected
      - from: dispatcher
        to: orchestrator
        on: blocked
      - from: orchestrator
        to: dispatcher
        on: next_task
      - from: orchestrator
        to: dispatcher
        on: plan_revised
      - from: orchestrator
        to: dispatcher
        on: new_plan
      - from: orchestrator
        to: brain
        on: need_human
      - from: orchestrator
        to: brain
        on: plan_closed

guards:
  size_after_scope_resolution: true
  large_min_runnable_tasks: 2
  preflight_before_topology: true
  forbid_existing_agent_reuse: false
  dispatcher_start: before_worker
  run_file_tracks_created_resources: true
  pin_herdr_session: true
  unique_agent_names: true
  require_plan_before_dispatch: true
  brain_does_not_wait: true
  focus_live_agent: true
  doctor_before_size: true
  require_live_inventory: true
  require_detection: true
  require_sizing_reason: true

task_states:
  pending: Listed, dependencies not satisfied
  ready: Dependencies done, not assigned
  assigned: Has workstream, dispatcher, and worker
  running: Worker is implementing
  blocked: Waiting on human or a missing fact
  in_review: Worker claimed done; Herdr idle is not enough
  rejected: Dispatcher sent it back
  accepted: Dispatcher receipt passed
  closed: Human signed off

task_transitions:
  pending:
    - ready
    - blocked
  ready:
    - assigned
    - blocked
  assigned:
    - running
    - blocked
  running:
    - in_review
    - blocked
  in_review:
    - accepted
    - rejected
    - blocked
  rejected:
    - running
    - blocked
  blocked:
    - ready
    - assigned
    - running
  accepted:
    - closed
  closed: []

watch:
  prompt_wait: true
  timeout_ms: 120000
  worker_timeout_ms: 1200000
  dispatcher_timeout_ms: 1200000
  start_timeout_ms: 180000
  first_prompt_timeout_ms: 15000
  trust_timeout_ms: 20000
  busy_retries: 8
  stalled_retries: 3
  settled:
    - idle
    - done
    - blocked
  grok_idle_is_not_done: true
  require_worker_receipt_file: true
  after_wait:
    - agent_get
    - agent_read
    - git_diff
    - receipt_file

parallel:
  require_no_file_overlap: true
  pair: dispatcher-and-worker
  each_workstream_own_worktree: true
  only_volume: large
  remove_worktree_after_merge: true

discovery:
  instructions:
    - AGENTS.md
    - CLAUDE.md
    - CONTRIBUTING.md
    - README.md
  requirements:
    - openspec
    - specs
    - .specify
    - docs/requirements
  adr:
    - docs/adr
    - adr
    - docs/decisions
    - openspec/architecture
  plans:
    - openspec/changes
    - plans
    - docs/plans
    - .cursor/plans
  state:
    - .beads
    - docs/state
