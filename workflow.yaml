# Global defaults for seats, volume recipes, CLIs, task states, and run layout.
# A project may override them with the manifest at layout.manifest.

layout:
  work_root: ".herdr"
  manifest: "{work_root}/workflow.yaml"
  profile: "{work_root}/project.md"
  change_dir: "{work_root}/runs/{change}"
  session: "{change_dir}/run.json"
  state: "{change_dir}/state.yaml"
  receipts: "{change_dir}/receipts"
  worker_receipt: "{receipts}/{task}.worker.md"
  dispatcher_receipt: "{receipts}/{task}.dispatcher.md"

visibility:
  pane_label: "{title} | {cli} {model} {effort}"
  pane_label_many: "{title} {n} | {cli} {model} {effort}"
  display_agent: "{title}"
  display_agent_many: "{title} {n}"
  metadata_source: workflow-herdr

clis:
  human:
    herdr_kind: null
    native_args: []
  codex:
    herdr_kind: codex
    native_args:
      - "--model"
      - "{model}"
      - "-c"
      - "model_reasoning_effort={effort}"
      - "--no-alt-screen"
  grok:
    herdr_kind: grok
    native_args:
      - "--model"
      - "{model}"
      - "--reasoning-effort"
      - "{effort}"
      - "--no-alt-screen"
  devin:
    herdr_kind: devin
    native_args:
      - "--model"
      - "{model}"
      - "--reasoning-effort"
      - "{effort}"
      - "--no-alt-screen"

roles:
  brain:
    title: Brain
    agent_name: brain
    cli: human
    model: null
    effort: null
    start: false
    notes: This chat. Intent is what the human typed here.

  orchestrator:
    title: Orchestrator
    agent_name: orchestrator
    cli: codex
    model: gpt-5.6-luna
    effort: max
    start: true

  dispatcher:
    title: Dispatcher
    agent_name_pattern: "dispatcher-{n}"
    cli: codex
    model: gpt-5.6-luna
    effort: high
    start: true
    many: true

  worker:
    title: Worker
    agent_name_pattern: "worker-{n}"
    cli: devin
    model: swe2
    effort: max
    start: true
    many: true

# Three run sizes. Brain chooses once, before topology is created.
volumes:
  small:
    use_when: One short prompt, one turn, no open design decisions
    project_artifacts: none
    coordination_state: false
    worktrees: false
    parallel: false
    seats: [brain, worker]
    sequence:
      - id: discuss
        owner: brain
        gate: Intent is clear in the current chat
      - id: execute
        owner: worker
        gate: Worker finished the requested change and Brain checked the result
      - id: close
        owner: brain
        gate: Human said the slice is done

  medium:
    use_when: One story, several files, decisions still fit one context
    project_artifacts: per-project-profile
    coordination_state: true
    worktrees: false
    parallel: false
    seats: [brain, orchestrator, dispatcher, worker]
    sequence:
      - id: discuss
        owner: brain
        gate: Business intent is separated from implementation detail
      - id: understand
        owner: orchestrator
        gate: Project workflow and relevant sources of truth are understood
      - id: shape
        owner: orchestrator
        gate: Work is decomposed using the project profile or an explicit handoff
      - id: dispatch
        owner: dispatcher
        gate: dispatcher-1 is up before worker-1 in the project cwd
      - id: execute
        owner: worker
        gate: Tasks reached in_review
      - id: review
        owner: dispatcher
        gate: Tasks accepted or rejected
      - id: close
        owner: brain
        gate: Human said the slice is done

  large:
    use_when: Two or more runnable workstreams with non-overlapping file boundaries
    project_artifacts: per-project-profile
    coordination_state: true
    worktrees: true
    parallel: true
    seats: [brain, orchestrator, dispatcher, worker]
    sequence:
      - id: discuss
        owner: brain
        gate: Business intent is separated from implementation detail
      - id: understand
        owner: orchestrator
        gate: Project workflow and relevant sources of truth are understood
      - id: size
        owner: orchestrator
        gate: Orchestrator defined independent workstreams and file sets
      - id: shape
        owner: orchestrator
        gate: Workstreams and boundaries follow the project profile or an explicit handoff
      - id: dispatch
        owner: dispatcher
        gate: Each worktree has dispatcher-N up before worker-N
      - id: execute
        owner: worker
        gate: Tasks reached in_review
      - id: review
        owner: dispatcher
        gate: Tasks accepted or rejected
      - id: merge
        owner: brain
        gate: Streams merged to the source branch
      - id: cleanup
        owner: brain
        gate: herdr worktree remove ran for every stream worktree
      - id: close
        owner: brain
        gate: Human said the slice is done

guards:
  size_after_scope_resolution: true
  large_min_runnable_tasks: 2
  preflight_before_topology: true
  forbid_existing_agent_reuse: true
  dispatcher_start: before_worker
  run_file_tracks_created_resources: true

task_states:
  pending: Listed, dependencies not satisfied
  ready: Dependencies done, not assigned
  assigned: Has workstream, dispatcher, and worker
  running: Worker is implementing
  blocked: Waiting on human or a missing fact
  in_review: Worker claimed done; Herdr idle is not enough
  rejected: Dispatcher sent it back
  accepted: Dispatcher receipt passed
  closed: Human signed off

task_transitions:
  pending:
    - ready
    - blocked
  ready:
    - assigned
    - blocked
  assigned:
    - running
    - blocked
  running:
    - in_review
    - blocked
  in_review:
    - accepted
    - rejected
    - blocked
  rejected:
    - running
    - blocked
  blocked:
    - ready
    - assigned
    - running
  accepted:
    - closed
  closed: []

watch:
  prompt_wait: true
  settled:
    - idle
    - done
    - blocked
  grok_idle_is_not_done: true
  require_worker_receipt_file: true
  after_wait:
    - agent_get
    - agent_read
    - git_diff
    - receipt_file

parallel:
  require_no_file_overlap: true
  pair: dispatcher-and-worker
  each_workstream_own_worktree: true
  only_volume: large
  remove_worktree_after_merge: true

agent_runtime:
  default: off
  use_when: Human asked for machine-evaluated Task acceptance
  maps_to: optional wrapper around one worker prompt, not a second board
