# Project-local Herdr manifest: .herdr/workflow.yaml
# Mapping keys merge recursively with the global workflow.yaml.
# Scalars and lists replace their global values. Omitted keys keep defaults.

# Where Herdr keeps local coordination state:
# layout:
#   work_root: ".herdr"
#   change_dir: "{work_root}/runs/{change}"
#   state: "{change_dir}/state.yaml"

roles:
  orchestrator:
    cli: codex
    model: gpt-5.6-sol
    effort: low
  dispatcher:
    cli: codex
    model: gpt-5.6-luna
    effort: high
  worker:
    cli: grok
    model: grok-4.6
    effort: high

# Any global section may be overridden locally. For example:
# volumes:
#   medium:
#     use_when: One bounded change handled in the project workspace
# guards:
#   large_min_runnable_tasks: 3
# watch:
#   prompt_wait: false
